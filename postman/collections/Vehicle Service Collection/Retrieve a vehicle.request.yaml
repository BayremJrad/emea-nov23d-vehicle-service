$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has correct structure", function () {
          const json = pm.response.json();

          pm.expect(json).to.be.an("object");
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("nickName");
          pm.expect(json).to.have.property("vin");
          pm.expect(json).to.have.property("make");
          pm.expect(json).to.have.property("model");
          pm.expect(json).to.have.property("year");
          pm.expect(json).to.have.property("miles");
      });

      pm.test("Response body fields have correct types", function () {
          const json = pm.response.json();

          pm.expect(json.id).to.be.a("number");
          pm.expect(json.nickName).to.be.a("string");
          pm.expect(json.vin).to.be.a("string");
          pm.expect(json.make).to.be.a("string");
          pm.expect(json.model).to.be.a("string");
          pm.expect(json.year).to.be.a("string");
          pm.expect(json.miles).to.be.a("number");
      });

      pm.test("Response id matches requested id", function () {
          const json = pm.response.json();
          const requestedId = parseInt(pm.request.url.variables.get("id"));

          pm.expect(json.id).to.eql(requestedId);
      });

settings: {}
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
